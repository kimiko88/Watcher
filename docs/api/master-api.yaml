openapi: 3.0.0
info:
  title: Classroom Control Master API
  description: REST API for managing the Classroom Control Master Server and connected clients.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local Development Server

paths:
  # ===========================================================================
  # CLIENTS
  # ===========================================================================
  /clients:
    get:
      summary: List all connected clients
      tags: [Clients]
      responses:
        '200':
          description: A list of clients
          content:
            application/json:
              schema:
                type: object
                properties:
                  clients:
                    type: array
                    items:
                      $ref: '#/components/schemas/Client'

  /clients/{client_id}:
    get:
      summary: Get detailed info for a specific client
      tags: [Clients]
      parameters:
        - in: path
          name: client_id
          schema:
            type: string
          required: true
          description: Unique ID of the client
      responses:
        '200':
          description: Client details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '404':
          description: Client not found

  /clients/{client_id}/lock:
    post:
      summary: Lock client screen
      tags: [Clients, Control]
      parameters:
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Client locked successfully

  /clients/{client_id}/unlock:
    post:
      summary: Unlock client screen
      tags: [Clients, Control]
      parameters:
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Client unlocked successfully

  /clients/{client_id}/screenshot:
    get:
      summary: Get screenshot of client screen
      tags: [Clients, Monitoring]
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - in: query
          name: quality
          schema:
            type: string
            enum: [low, medium, high]
            default: medium
      responses:
        '200':
          description: PNG Image
          content:
            image/png:
              schema:
                type: string
                format: binary

  # ===========================================================================
  # BROADCAST
  # ===========================================================================
  /broadcast/lock:
    post:
      summary: Lock all client screens
      tags: [Broadcast]
      responses:
        '200':
          description: Broadcast command sent

  /broadcast/unlock:
    post:
      summary: Unlock all client screens
      tags: [Broadcast]
      responses:
        '200':
          description: Broadcast command sent

  /broadcast/screenshot:
    post:
      summary: Take screenshot on all clients
      tags: [Broadcast, Monitoring]
      responses:
        '200':
          description: Screenshots initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: {type: string}
                  status: {type: string}

  /broadcast/show-screen:
    post:
      summary: Stream master screen to all clients
      tags: [Broadcast]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum: [fullscreen, window]
      responses:
        '200':
          description: Streaming started

  # ===========================================================================
  # POWER
  # ===========================================================================
  /clients/{client_id}/power/{action}:
    post:
      summary: Perform power action on specific client
      tags: [Power]
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - in: path
          name: action
          schema:
            type: string
            enum: [shutdown, restart, sleep]
          required: true
      responses:
        '200':
          description: Power action sent
  
  /broadcast/power/{action}:
    post:
      summary: Perform power action on all clients
      tags: [Power, Broadcast]
      parameters:
        - in: path
          name: action
          schema:
            type: string
            enum: [shutdown, restart, sleep]
          required: true
      responses:
        '200':
          description: Broadcast power action sent

  # ===========================================================================
  # DOMAINS
  # ===========================================================================
  /clients/{client_id}/domains/rules:
    get:
      summary: Get current filter rules
      tags: [Domains]
      parameters:
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Current rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainRules'
    delete:
      summary: Clear all rules
      tags: [Domains]
      parameters:
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Rules cleared

  /clients/{client_id}/domains/block:
    post:
      summary: Add domains to blocklist
      tags: [Domains]
      parameters:
        - $ref: '#/components/parameters/ClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                domains:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Domains blocked

  /clients/{client_id}/domains/allow:
    post:
      summary: Add domains to whitelist
      tags: [Domains]
      parameters:
        - $ref: '#/components/parameters/ClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                domains:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Domains allowed

  # ===========================================================================
  # MESSAGES
  # ===========================================================================
  /clients/{client_id}/message:
    post:
      summary: Send text message to client
      tags: [Messages]
      parameters:
        - $ref: '#/components/parameters/ClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: {type: string}
                message: {type: string}
                timeout_seconds: {type: integer, default: 10}
      responses:
        '200':
          description: Message sent

  # ===========================================================================
  # MONITORING
  # ===========================================================================
  /server/status:
    get:
      summary: Get server health and status
      tags: [Monitoring]
      responses:
        '200':
          description: Server status
          content:
            application/json:
              schema:
                type: object
                properties:
                  uptime_seconds: {type: integer}
                  client_count: {type: integer}
                  status: {type: string, enum: [ok, degraded, maintenance]}

  /server/performance:
    get:
      summary: Get server performance stats
      tags: [Monitoring]
      responses:
        '200':
          description: Performance metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  cpu_usage_percent: {type: number}
                  ram_usage_mb: {type: number}
                  network_in_mbps: {type: number}
                  network_out_mbps: {type: number}

components:
  parameters:
    ClientId:
      in: path
      name: client_id
      schema:
        type: string
      required: true
      description: Unique ID of the client

  schemas:
    Client:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        ip:
          type: string
        status:
          type: string
          enum: [online, offline, locked]
        os:
          type: string
        version:
          type: string

    DomainRules:
      type: object
      properties:
        blocked:
          type: array
          items:
            type: string
        allowed:
          type: array
          items:
            type: string
